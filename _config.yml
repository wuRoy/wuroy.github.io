# Site Settings
title: Wu Research Group
description: 
url: "https://wuroy.github.io"
baseurl: ""

# Author
author:
  name: Guangqi Wu
  email: guangqiwu@email.sdu.edu.cn
  bio: "About me"
  avatar: /assets/images/avatar.jpg

# Social Links
social:
  github: https://github.com/wuRoy
  linkedin: https://www.linkedin.com/in/guangqi-wu-a31b02239
  email: guangqiwu@email.sdu.edu.cn
  google_scholar: https://scholar.google.com/citations?user=y7sRCX0AAAAJ&hl=en

# Build Settings
markdown: kramdown
highlighter: rouge
future: true

# Sass
sass:
  sass_dir: assets/css
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  news:
    output: true
    permalink: /news/:title/
  people:
    sort_by: order

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - node_modules
  - vendor
