# Research intro (displayed at the top of the research page)
intro: |
  Polymers are everywhere in our lives, from plastics to proteins. Their design space is enormous, including but not limited to monomer structure, composition, blockiness, sequence, and molecular weight. This breadth gives ample room for designed function, as we see in systems as different as plastics, hydrogels, and enzymes. That same diversity makes discovery difficult. Experimentally, the space is hard to enumerate; even exploring a narrow region of it demands significant synthesis and characterization efforts. Computationally, the systems are often too complex and too disordered to simulate reliably. Our mission is to understand and engineer complex macromolecular systems for healthcare and sustainability, drawing on synthetic chemistry and biophysics alongside laboratory automation, machine learning, and single-molecule technology. We aim to deliver the materials as well as the tools to facilitate the discovery.

