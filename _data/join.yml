# Location section shown on the Join Us page, below the intro and above positions.
# `text` is Markdown; `figures` is an optional list of images with captions.
# Remove this block entirely to hide the section.
location:
  text: |
    The group is based at Shandong University's Qingdao campus, in the Aoshanwei area of Jimo District, Qingdao. The campus sits on Aoshan Bay, with the Yellow Sea a short walk to the east and wooded hills rising behind it, a quiet, green corner of the city.

    Qingdao is a lively coastal city on the southern shore of the Shandong Peninsula, China, known for its long shoreline, beer, and seafood. It is the home of the Tsingtao Beer and the city has the tradition of drinking it from a plastic bag. The campus is about an hour from downtown, and is well connected by metro, high-speed rail, and an international airport. Day-to-day life is affordable, apartments near campus typically rent for around ¥1,800 a month. Students and postdocs can live minutes from both the lab and the sea.

  figures:
    - image: /assets/images/location1.jpg
      caption: "Qingdao, on the southern coast of the Shandong Peninsula"
    - image: /assets/images/location2.jpg
      caption: "The Qingdao campus in Aoshanwei, by Aoshan Bay"
    - image: /assets/images/campus_view.jpg
      caption: "Woodland and hills around the campus"
      wide: true

    - image: /assets/images/beer_in_bag.jpg
      caption: "Bagged Tsingtao beer — a Qingdao tradition"
    - image: /assets/images/cat_in_campus.jpg
      caption: "We are waiting for you!"

